<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 500px;
            height: 300px;
            border: 1px solid black;
            border-radius: 15px;
            
            color: black;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        span#blue {
            color: blue;
        }
    </style>
</head>
<body>
    <div class="container">
        Welcome, {{ user }}
    </div>
</body>
</html>
